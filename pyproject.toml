[project]
name = "receipt-analyzer"
version = "0.1.0"
description = "A simple MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "pydantic"
    # 중요: 여기에 pyodbc는 절대 적지 마세요!
]

[project.scripts]
receipt-analyzer = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]